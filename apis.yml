aid: oxa
name: Oxa
description: 'Oxa (formerly Oxbotica, rebranded in 2023) is a British autonomous vehicle
  software company founded in 2014 in Oxford, England by Paul Newman and Ingmar Posner.
  Oxa builds what it calls Universal Autonomy — self-driving software configurable for
  almost any vehicle in almost any environment — and sells it as Industrial Mobility
  Automation for ports, airports, manufacturing yards, solar farms and shuttle networks.
  Its product line is Oxa Driver (the autonomy stack), Oxa Foundry (a generative-AI training
  and assurance toolchain, previously marketed as Oxa MetaDriver), Reference Autonomy
  Designs (modular hardware integration blueprints), and Oxa Hub (a cloud fleet-management
  suite covering remote assist, task design, workspace mapping, digital twins and in-use
  monitoring). Oxa Hub is described on the marketing site as offering "an API for optional
  integration with existing logistics systems", but Oxa publishes no developer portal,
  no API reference and no machine-readable specification on any public host. The company
  raised a $115M Series C in 2023 with participation from Google, and works with Ocado
  Group, ZF and bp.'
